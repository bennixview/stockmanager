<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="de" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE - Stockmanager">Stockmanager</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/portfolio.css}">
    <script defer th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
    <!--
      UI integration between self-contained systems: the quote widget is loaded from the market
      data system, so live prices are rendered by the system that owns them.
    -->
    <script defer th:src="${marketDataUrl} + '/js/market-quote.js'"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom border-secondary-subtle">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">
            <span class="badge text-bg-primary me-2">SCS</span>Stockmanager
        </a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:href="@{/}">Depot</a>
            <a class="nav-link" th:href="@{/swagger-ui.html}">API</a>
        </div>
        <a class="btn btn-outline-info btn-sm" th:href="${marketDataUrl}" target="_blank" rel="noopener">
            Marktdaten &rarr;
        </a>
    </div>
</nav>

<main class="container py-4">
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${message}">
        <span th:text="${message}">Done</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <section layout:fragment="content">
        <p>Page content goes here</p>
    </section>
</main>

<footer class="container py-4 text-secondary small border-top border-secondary-subtle">
    Portfolio-System &middot; besitzt Depots, Positionen und Trades &middot; Kurse kommen aus dem Marktdaten-System
</footer>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<!-- Page-specific scripts go here; anything outside a layout fragment is dropped. -->
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
