name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # Compiles both self-contained systems and runs every test, including the ArchUnit rules
      # that guard the hexagonal boundaries.
      - name: Build and test
        run: mvn -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore

  images:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # one image per self-contained system: they are released independently
        system: [ marketdata, portfolio ]
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -f scs-${{ matrix.system }}/Dockerfile -t stockmanager-${{ matrix.system }}:${{ github.sha }} .

      # Publishing only happens for main, and only where the registry is configured.
      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main' && vars.AWS_REGION != ''
        uses: aws-actions/amazon-ecr-login@v2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Tag and push
        if: github.ref == 'refs/heads/main' && vars.AWS_REGION != ''
        env:
          REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
          IMAGE: stockmanager-${{ matrix.system }}
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$REGISTRY/$IMAGE:${{ github.sha }}"
          docker tag "$IMAGE:${{ github.sha }}" "$REGISTRY/$IMAGE:latest"
          docker push "$REGISTRY/$IMAGE:${{ github.sha }}"
          docker push "$REGISTRY/$IMAGE:latest"
